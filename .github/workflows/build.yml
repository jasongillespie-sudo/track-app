name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: base64 -d app/videotimer.keystore.b64 > app/videotimer.keystore
      - run: gradle assembleRelease
      - run: cp app/build/outputs/apk/release/app-release.apk VideoTimer.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VideoTimer-apk
          path: VideoTimer.apk